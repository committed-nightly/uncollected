[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uncollected"
version = "0.1.0"
description = "Find the tests pytest never runs: files that match no python_files pattern, classes it will not instantiate, definitions shadowed by a later one, and setup methods it stopped calling in 8.0."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["pytest", "testing", "collection", "linter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
uncollected = "uncollected.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/uncollected"

[tool.hatch.build.targets.wheel]
packages = ["src/uncollected"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes only. These are the rules about code that cannot be right, which is
# the argument made in committed-nightly/logbook#36 -- an `import pytest` that
# is not used is clutter, but an F811 is a definition that never runs, and this
# repository is about exactly that.
select = ["F"]
